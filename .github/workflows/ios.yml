name: iOS CI

on:
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 10

    env:
      PROJECT: ios/WebGuard.xcodeproj
      SCHEME: WebGuard
      DERIVED_DATA_PATH: build/DerivedData
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate release identity
        run: ./scripts/validate-release-identity.sh

      - name: Run tests
        run: |
          set -eo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available iOS | awk -F '[()]' '/iPhone/ { print $2; exit }')"

          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator found."
            xcrun simctl list devices available
            exit 1
          fi

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=$SIMULATOR_ID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO \
            test

      - name: Build app for iOS device
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -eo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            build

  release:
    name: Create GitHub release
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: webguard-app-release
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          VERSION_CONFIG: ios/WebGuard/Config/Release.xcconfig
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MARKETING_VERSION="$(awk -F ' = ' '/^MARKETING_VERSION = / { print $2; exit }' "$VERSION_CONFIG")"

          if [[ ! "$MARKETING_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "MARKETING_VERSION must use MAJOR.MINOR.PATCH format: $MARKETING_VERSION" >&2
            exit 1
          fi

          CURRENT_TAG="$(git tag --points-at "$GITHUB_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [[ -n "$CURRENT_TAG" ]] && gh release view "$CURRENT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release $CURRENT_TAG already exists for this commit."
            exit 0
          fi

          LATEST_TAG="$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [[ -z "$LATEST_TAG" ]]; then
            VERSION="$MARKETING_VERSION"
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create published release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --latest
